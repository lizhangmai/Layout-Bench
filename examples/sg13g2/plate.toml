schema_version = 1
mode = "characterization"

[[jobs]]
id = "parasitics"
stage = "extract"
operation = "layout.extract_capacitance"
inputs = { layout = "input:layout" }
outputs = { netlist = "spice" }
parameters = { top_cell = "PLATE", ports = ["P", "GND"] }

[[jobs]]
id = "ac"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:ac", dut = "job:parasitics:netlist" }
parameters = { measurements = { capacitance = "F" } }

[[metrics]]
id = "plate_capacitance"
category = "performance"
observations = ["ac:capacitance"]
unit = "F"
direction = "minimize"
aggregation = "max"
