schema_version = 1
# The gateway currently implements the provider-neutral Responses wire family.
# A harness may use it through its own bridge; the session runner does not
# assume which harness owns the conversation.
wire_api = "responses"
base_url = "https://api.openai.com/v1"
model = "REPLACE_WITH_YOUR_MODEL"
api_key_env = "LAYOUT_BENCH_API_KEY"
max_requests = 100
request_timeout_seconds = 60
