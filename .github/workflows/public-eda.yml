name: Public EDA preview
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: public-eda-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  public-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.2'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked python scripts/public_preview.py quickstart --network host --output build/runs/preview
      - name: Run repeatable EDA acceptance suite
        run: uv run --locked python scripts/acceptance.py eda --image layout-bench-tools:local
      - run: bash tests/integration/test_toolchain.sh tools
      - run: bash tests/integration/test_build_context.sh
      - run: uv run --locked python scripts/public_preview.py qualify --prepared build/runs/preview/prepared --output build/runs/preview-qualification
      - run: uv run --locked pytest tests/integration/test_batch.py tests/integration/test_admission_cli.py tests/integration/test_session.py
        env:
          LAYOUT_BENCH_TEST_IMAGE: layout-bench-tools:local
      - run: git diff --exit-code
