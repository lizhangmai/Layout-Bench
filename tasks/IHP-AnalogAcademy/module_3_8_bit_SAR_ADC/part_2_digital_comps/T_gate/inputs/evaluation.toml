schema_version = 1
mode = "post_layout"

[[jobs]]
id = "artifact"
stage = "check"
operation = "layout.artifact"
gate = "artifact"
inputs = { layout = "candidate", task = "task" }

[[jobs]]
id = "drc"
stage = "check"
operation = "layout.drc"
gate = "drc"
inputs = { layout = "candidate", task = "task" }

[[jobs]]
id = "lvs"
stage = "check"
operation = "layout.lvs"
gate = "lvs"
inputs = { layout = "candidate", task = "task", netlist = "input:netlist" }
outputs = { database = "klayout-lvs", binding = "json" }

[[jobs]]
id = "geometry"
stage = "check"
operation = "layout.constraints"
gate = "constraint"
requires = ["artifact", "drc"]
inputs = { layout = "candidate", task = "task", constraints = "input:constraints", database = "job:lvs:database", binding = "job:lvs:binding" }

[[jobs]]
id = "parasitics"
stage = "extract"
operation = "layout.extract_capacitance"
requires = ["artifact", "drc", "lvs", "geometry"]
inputs = { layout = "candidate", task = "task" }
outputs = { netlist = "spice" }
parameters = { ports = ["VOUT", "VIN", "!CONTROL", "CONTROL", "GND", "VDD"] }

[[jobs]]
id = "on_27_2"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:on", dut = "job:parasitics:netlist" }
parameters = { values = { signal_level = 0.2, temperature_c = 27 }, measurements = { on_resistance = "ohm" } }

[[jobs]]
id = "on_27_6"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:on", dut = "job:parasitics:netlist" }
parameters = { values = { signal_level = 0.6, temperature_c = 27 }, measurements = { on_resistance = "ohm" } }

[[jobs]]
id = "on_27_10"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:on", dut = "job:parasitics:netlist" }
parameters = { values = { signal_level = 1.0, temperature_c = 27 }, measurements = { on_resistance = "ohm" } }

[[jobs]]
id = "off_27"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:off", dut = "job:parasitics:netlist" }
parameters = { values = { temperature_c = 27 }, measurements = { off_current = "A" } }

[[jobs]]
id = "transient_27_20"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:transient", dut = "job:parasitics:netlist" }
outputs = { waveform = "ngspice-raw" }
parameters = { values = { temperature_c = 27, load_f = 2e-14 }, measurements = { rise_delay = "s", fall_delay = "s", sample_error = "V" }, exports = { waveform = "transient.raw" } }

[[jobs]]
id = "transient_27_100"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:transient", dut = "job:parasitics:netlist" }
outputs = { waveform = "ngspice-raw" }
parameters = { values = { temperature_c = 27, load_f = 1e-13 }, measurements = { rise_delay = "s", fall_delay = "s", sample_error = "V" }, exports = { waveform = "transient.raw" } }

[[jobs]]
id = "on_125_2"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:on", dut = "job:parasitics:netlist" }
parameters = { values = { signal_level = 0.2, temperature_c = 125 }, measurements = { on_resistance = "ohm" } }

[[jobs]]
id = "on_125_6"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:on", dut = "job:parasitics:netlist" }
parameters = { values = { signal_level = 0.6, temperature_c = 125 }, measurements = { on_resistance = "ohm" } }

[[jobs]]
id = "on_125_10"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:on", dut = "job:parasitics:netlist" }
parameters = { values = { signal_level = 1.0, temperature_c = 125 }, measurements = { on_resistance = "ohm" } }

[[jobs]]
id = "off_125"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:off", dut = "job:parasitics:netlist" }
parameters = { values = { temperature_c = 125 }, measurements = { off_current = "A" } }

[[jobs]]
id = "transient_125_20"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:transient", dut = "job:parasitics:netlist" }
outputs = { waveform = "ngspice-raw" }
parameters = { values = { temperature_c = 125, load_f = 2e-14 }, measurements = { rise_delay = "s", fall_delay = "s", sample_error = "V" }, exports = { waveform = "transient.raw" } }

[[jobs]]
id = "transient_125_100"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:transient", dut = "job:parasitics:netlist" }
outputs = { waveform = "ngspice-raw" }
parameters = { values = { temperature_c = 125, load_f = 1e-13 }, measurements = { rise_delay = "s", fall_delay = "s", sample_error = "V" }, exports = { waveform = "transient.raw" } }

[[metrics]]
id = "on_resistance"
category = "performance"
observations = ["on_27_2:on_resistance", "on_27_6:on_resistance", "on_27_10:on_resistance", "on_125_2:on_resistance", "on_125_6:on_resistance", "on_125_10:on_resistance"]
unit = "ohm"
direction = "minimize"
aggregation = "max"
lower = 0
upper = 6000

[[metrics]]
id = "off_current"
category = "performance"
observations = ["off_27:off_current", "off_125:off_current"]
unit = "A"
direction = "minimize"
aggregation = "max"
lower = 0
upper = 1e-08

[[metrics]]
id = "rise_delay_20"
category = "performance"
observations = ["transient_27_20:rise_delay", "transient_125_20:rise_delay"]
unit = "s"
direction = "minimize"
aggregation = "max"
lower = 0
upper = 5e-11

[[metrics]]
id = "fall_delay_20"
category = "performance"
observations = ["transient_27_20:fall_delay", "transient_125_20:fall_delay"]
unit = "s"
direction = "minimize"
aggregation = "max"
lower = 0
upper = 5e-11

[[metrics]]
id = "sample_error_20"
category = "performance"
observations = ["transient_27_20:sample_error", "transient_125_20:sample_error"]
unit = "V"
direction = "minimize"
aggregation = "max"
lower = 0
upper = 0.0001

[[metrics]]
id = "rise_delay_100"
category = "performance"
observations = ["transient_27_100:rise_delay", "transient_125_100:rise_delay"]
unit = "s"
direction = "minimize"
aggregation = "max"
lower = 0
upper = 2e-10

[[metrics]]
id = "fall_delay_100"
category = "performance"
observations = ["transient_27_100:fall_delay", "transient_125_100:fall_delay"]
unit = "s"
direction = "minimize"
aggregation = "max"
lower = 0
upper = 2e-10

[[metrics]]
id = "sample_error_100"
category = "performance"
observations = ["transient_27_100:sample_error", "transient_125_100:sample_error"]
unit = "V"
direction = "minimize"
aggregation = "max"
lower = 0
upper = 0.012

[[metrics]]
id = "area"
category = "physical"
observations = ["geometry:area"]
unit = "um2"
direction = "minimize"
aggregation = "max"
