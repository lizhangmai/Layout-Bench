schema_version = 1
mode = "physical"

[[jobs]]
id = "artifact"
stage = "check"
operation = "layout.artifact"
gate = "artifact"
inputs = { layout = "candidate", task = "task" }

[[jobs]]
id = "drc"
stage = "check"
operation = "layout.drc"
gate = "drc"
inputs = { layout = "candidate", task = "task" }

[jobs.parameters]
[[jobs.parameters.waivers]]
category = "'NBL.b'"
cell = "DIFF_COMPARATOR"
markers = [
  "edge-pair: (5.13,26.07;16.89,26.07)|(16.995,26.175;5.025,26.175)",
  "edge-pair: (5.025,15.345;7.165,15.345)|(7.165,15.45;5.13,15.45)",
  "edge-pair: (14.855,15.345;16.995,15.345)|(16.89,15.45;14.855,15.45)",
  "edge-pair: (5.13,15.45;5.13,26.07)|(5.025,26.175;5.025,15.345)",
  "edge-pair: (16.995,15.345;16.995,26.175)|(16.89,26.07;16.89,15.45)",
  "edge-pair: (5.13,26.07;12.506,26.07)|(11.01,26.175;5.025,26.175)",
  "edge-pair: (9.514,26.07;16.89,26.07)|(16.995,26.175;11.01,26.175)",
]
reason = "The pinned upstream comparator contains a continuous nBuLay ring adjacent to the NWell-derived nBuLay; the SG13G2 main deck reports these seven fixed same-net 0.105 um notch markers. The benchmark accepts this reviewed upstream geometry as a case-local exception, limited to these exact DIFF_COMPARATOR markers; it does not change the PDK rule."

[[jobs]]
id = "lvs"
stage = "check"
operation = "layout.lvs"
gate = "lvs"
inputs = { layout = "candidate", task = "task", netlist = "input:netlist" }
outputs = { database = "klayout-lvs", binding = "json" }

[[jobs]]
id = "geometry"
stage = "check"
operation = "layout.geometry"
gate = "constraint"
requires = ["artifact", "drc", "lvs"]
inputs = { layout = "candidate", task = "task", constraints = "input:constraints", database = "job:lvs:database", binding = "job:lvs:binding" }

[[metrics]]
id = "functional_area"
category = "physical"
observations = ["geometry:area"]
unit = "um2"
direction = "minimize"
aggregation = "max"
