schema_version = 2
kind = "layout_case"
id = "module_3_8_bit_SAR_ADC.part_5_analog_layout.comparator"
title = "IHP AnalogAcademy comparator"
role = "design"
status = "qualified"

# Solver inputs, answer contract, and scoring entry point.
[task]
kind = "netlist_to_gds"
family = "ihp_sg13g2_analog_comparator"
environment = "ihp-sg13g2-comparator-rc-tt"

[task.inputs.description]
path = "problem.md"
sha256 = "a8114dac2f3067b7d2f812543dc2621e98a9f2a5630fdb2d003a749d1580b6c7"
format = "text"

[task.inputs.netlist]
path = "materials/circuit.spice"
sha256 = "fb74cb22eebf4ee891956ef779718a9378ef3a5d538c62b527684873f9bec1f5"
format = "spice"
subcircuit = "DIFF_COMPARATOR"

[task.inputs.performance]
path = "materials/testbench.spice"
sha256 = "a34ea030b581f0c2825f7b95969149e19d07f231e6074e78a6656af559478857"
format = "spice"

[task.constraints]
schema_version = 1

[[task.constraints.hard]]
id = "outline"
type = "bbox_max"
functional_layers = [
  [1, 0], [5, 0], [6, 0], [8, 0], [10, 0],
  [19, 0], [29, 0], [30, 0], [31, 0], [32, 0],
  [40, 0], [50, 0], [63, 0], [126, 0], [134, 0],
]
max_width_um = 45
max_height_um = 45

[[task.constraints.quality]]
id = "area"
type = "functional_bbox_area"
layers_from = "outline"

[task.output]
path = "output/final.gds"
format = "gds"
top_cell = "DIFF_COMPARATOR"
max_bytes = 10485760

# Public scoring procedure and requirements.
[task.evaluation]
schema_version = 1
mode = "post_layout"

[[task.evaluation.jobs]]
id = "artifact"
stage = "check"
operation = "layout.artifact"
gate = "artifact"
inputs = { layout = "candidate", task = "task" }

[[task.evaluation.jobs]]
id = "drc"
stage = "check"
operation = "layout.drc"
gate = "drc"
inputs = { layout = "candidate", task = "task" }

[[task.evaluation.jobs]]
id = "lvs"
stage = "check"
operation = "layout.lvs"
gate = "lvs"
inputs = { layout = "candidate", task = "task", netlist = "input:netlist" }
outputs = { database = "klayout-lvs", binding = "json" }

[[task.evaluation.jobs]]
id = "geometry"
stage = "check"
operation = "layout.geometry"
gate = "constraint"
requires = ["artifact", "drc", "lvs"]
inputs = { layout = "candidate", task = "task", constraints = "input:constraints", database = "job:lvs:database", binding = "job:lvs:binding" }

[[task.evaluation.jobs]]
id = "parasitics"
stage = "extract"
operation = "layout.extract_rc"
requires = ["artifact", "drc", "lvs", "geometry"]
inputs = { layout = "candidate" }
outputs = { netlist = "spice" }
parameters = { top_cell = "DIFF_COMPARATOR", ports = ["vdd", "gnd", "V+", "V-", "clk", "out-", "out+", "vbias"] }

[[task.evaluation.jobs]]
id = "negative_5mv"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:performance", dut = "job:parasitics:netlist" }
outputs = { waveform = "ngspice-raw" }
[task.evaluation.jobs.parameters]
values = { input_difference = -0.005, polarity = -1 }
exports = { waveform = "comparator.raw" }
