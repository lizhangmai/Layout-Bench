# Trusted evaluator bindings; not materialized for the solver.
[toolchain]
schema_version = 1

[toolchain.backends.artifact]
type = "klayout-docker"
[toolchain.backends.artifact.settings]
image = "layout-bench-tools:local"
check = "artifact"

[toolchain.backends.drc]
type = "klayout-docker"
[toolchain.backends.drc.settings]
image = "layout-bench-tools:local"
check = "drc"
support = "build/support/comparator-klayout"
profile = "drc-upstream.json"
timeout_seconds = 600

[toolchain.backends.lvs]
type = "klayout-docker"
[toolchain.backends.lvs.settings]
image = "layout-bench-tools:local"
check = "lvs"
support = "build/support/comparator-klayout"
profile = "lvs-analogacademy.json"
timeout_seconds = 600

[toolchain.backends.geometry]
type = "klayout-geometry-docker"
[toolchain.backends.geometry.settings]
image = "layout-bench-tools:local"
timeout_seconds = 120

[toolchain.backends.rc]
type = "magic-rc-docker"
[toolchain.backends.rc.settings]
image = "layout-bench-tools:local"
support = "build/support/comparator-magic"
technology = "magic/ihp-sg13g2.tech"
tech_name = "ihp-sg13g2"
style = "ngspice()"
capacitance_threshold_ff = 0
timeout_seconds = 600

[toolchain.backends.simulation]
type = "ngspice-docker"
[toolchain.backends.simulation.settings]
image = "layout-bench-tools:local"
support = "build/support/comparator-models"
timeout_seconds = 600

[toolchain.bindings]
"layout.artifact" = "artifact"
"layout.drc" = "drc"
"layout.lvs" = "lvs"
"layout.geometry" = "geometry"
"layout.extract_rc" = "rc"
"circuit.simulate" = "simulation"

