schema_version = 1
mode = "characterization"

[[jobs]]
id = "operating_point"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:dc", dut = "input:dut" }
[jobs.parameters]
measurements = { ratio = "1", power = "W" }

[[metrics]]
id = "voltage_ratio"
category = "performance"
observations = ["operating_point:ratio"]
unit = "1"
direction = "target"
aggregation = "min"
lower = 0.49
upper = 0.51

[[metrics]]
id = "dc_power"
category = "performance"
observations = ["operating_point:power"]
unit = "W"
direction = "minimize"
aggregation = "max"
upper = 0.0006
