[pytest]
testpaths = tests
pythonpath = tests
addopts = --strict-markers
markers =
    unit: Offline module tests without containers or model calls
    integration: Tests across modules or external tools
    acceptance: Black-box acceptance coverage for the public runner contract
    acceptance_fast: Deterministic acceptance checks suitable for every CI run
    acceptance_container: Acceptance checks requiring the prepared Docker image but no EDA
    acceptance_eda: Long-running acceptance checks requiring EDA tools or a public preview
